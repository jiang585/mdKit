[package]
name = "md-toolbox"
version = "1.0.0"
description = "轻量、高性能的 Markdown 编辑与预览工具箱"
authors = ["jiuji"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "md_toolbox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
windows-core = "0.59"
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
keyring = "3"
dirs = "5"
open = "5"
base64 = "0.22"
regex = "1"

[target."cfg(windows)".dependencies]
webview2-com = "0.35"
windows = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
