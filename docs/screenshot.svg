<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2c47"/>
      <stop offset="1" stop-color="#14233a"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="30" y="20" width="1220" height="680" rx="14" fill="#0d1726" filter="url(#shadow)"/>
  <!-- 标题栏 -->
  <rect x="30" y="20" width="1220" height="46" rx="14" fill="url(#titleGrad)"/>
  <rect x="30" y="46" width="1220" height="20" fill="url(#titleGrad)"/>
