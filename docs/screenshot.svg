  <circle cx="90" cy="43" r="7" fill="#febc2e"/>
  <circle cx="114" cy="43" r="7" fill="#28c840"/>
  <text x="640" y="49" text-anchor="middle" font-size="16" fill="#9fb4d0">MD工具箱 — mdKit v1.0.0</text>

  <!-- 标签栏 -->
  <rect x="30" y="66" width="1220" height="40" fill="#101c2e"/>
  <rect x="46" y="66" width="190" height="40" fill="#0d1726"/>
  <circle cx="66" cy="86" r="5" fill="#f08c8c"/>
  <text x="80" y="91" font-size="14" fill="#c9d8ec">README.md</text>
  <text x="150" y="91" font-size="14" fill="#c9d8ec">×</text>
  <rect x="240" y="66" width="170" height="40" fill="transparent"/>
  <circle cx="260" cy="86" r="5" fill="#4a5c78"/>
  <text x="274" y="91" font-size="14" fill="#6c7f9e">笔记.md</text>
  <text x="330" y="91" font-size="14" fill="#6c7f9e">×</text>

  <!-- 分隔线 -->
  <line x1="30" y1="106" x2="1250" y2="106" stroke="#1a2c47" stroke-width="1"/>
  <line x1="675" y1="106" x2="675" y2="684" stroke="#1a2c47" stroke-width="1.5"/>

  <!-- 编辑器 -->
  <rect x="30" y="106" width="645" height="552" fill="#0d1726"/>
  <text x="56" y="140" font-size="20" font-weight="bold" fill="#58a6ff"># MD工具箱</text>
  <text x="56" y="170" font-size="15" fill="#b9c8dd">轻量、高性能的 Markdown 编辑与预览</text>
  <text x="56" y="190" font-size="15" fill="#b9c8dd">桌面应用（Electron + CodeMirror 6）</text>
  <text x="56" y="222" font-size="16" font-weight="bold" fill="#58a6ff">## 特性</text>
  <text x="56" y="252" font-size="15" fill="#b9c8dd">- 实时预览 · 双栏分屏</text>
  <text x="56" y="272" font-size="15" fill="#b9c8dd">- LaTeX 数学公式 </text>
  <text x="56" y="292" font-size="15" fill="#b9c8dd">- GFM 表格 / 任务列表</text>
  <text x="56" y="312" font-size="15" fill="#b9c8dd">- Mermaid 图表</text>
  <text x="56" y="332" font-size="15" fill="#b9c8dd">- 4 套主题 · 自定义导入</text>
  <text x="56" y="364" font-size="15" fill="#b9c8dd">```</text>
  <text x="84" y="364" font-size="15" fill="#7ee787">ts</text>
  <text x="56" y="388" font-size="15" fill="#ff7b72">const</text>
  <text x="120" y="388" font-size="15" fill="#79c0ff">app</text>
  <text x="150" y="388" font-size="15" fill="#ff7b72">=</text>
  <text x="170" y="388" font-size="15" fill="#7ee787">new</text>
  <text x="208" y="388" font-size="15" fill="#79c0ff">MdKit</text>
  <text x="252" y="388" font-size="15" fill="#b9c8dd">();</text>
  <text x="56" y="412" font-size="15" fill="#79c0ff">app</text>
  <text x="90" y="412" font-size="15" fill="#ff7b72">.</text>
  <text x="98" y="412" font-size="15" fill="#7ee787">render</text>
  <text x="138" y="412" font-size="15" fill="#b9c8dd">();</text>
  <text x="56" y="436" font-size="15" fill="#b9c8dd">```</text>

  <!-- 行号 -->
  <text x="46" y="140" font-size="12" fill="#3c4f6b">1</text>
  <text x="46" y="170" font-size="12" fill="#3c4f6b">2</text>
  <text x="46" y="190" font-size="12" fill="#3c4f6b">3</text>
  <text x="46" y="222" font-size="12" fill="#3c4f6b">4</text>
  <text x="46" y="252" font-size="12" fill="#3c4f6b">5</text>
  <text x="46" y="272" font-size="12" fill="#3c4f6b">6</text>
  <text x="46" y="292" font-size="12" fill="#3c4f6b">7</text>
  <text x="46" y="312" font-size="12" fill="#3c4f6b">8</text>
  <text x="46" y="332" font-size="12" fill="#3c4f6b">9</text>
  <text x="46" y="364" font-size="12" fill="#3c4f6b">10</text>
  <text x="46" y="388" font-size="12" fill="#3c4f6b">11</text>
  <text x="46" y="412" font-size="12" fill="#3c4f6b">12</text>
  <text x="46" y="436" font-size="12" fill="#3c4f6b">13</text>
  <rect x="52" y="375" width="560" height="2" fill="#2a3d5c"/>

  <!-- 预览区 -->
  <rect x="675" y="106" width="575" height="552" fill="#101c2e"/>
  <text x="712" y="140" font-size="24" font-weight="bold" fill="#f0f6ff">MD工具箱</text>
  <text x="712" y="168" font-size="15" fill="#a9bdd8">轻量、高性能的 Markdown 编辑与预览桌面应用</text>
  <line x1="712" y1="182" x2="712" y2="184" stroke="#33476a" stroke-width="2"/>
  <text x="712" y="212" font-size="18" font-weight="bold" fill="#f0f6ff">特性</text>
  <rect x="712" y="228" width="15" height="15" rx="3" fill="#33476a"/>
  <path d="M715 235.5 l3.4 3.4 l6 -6" stroke="#7ee787" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="740" y="241" font-size="15" fill="#c6d4e8">实时预览 · 双栏分屏 · 滚动同步</text>
  <rect x="712" y="254" width="15" height="15" rx="3" fill="#33476a"/>
  <path d="M715 261.5 l3.4 3.4 l6 -6" stroke="#7ee787" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="740" y="267" font-size="15" fill="#c6d4e8">LaTeX 数学公式</text>
  <rect x="712" y="280" width="15" height="15" rx="3" fill="#33476a"/>
  <path d="M715 287.5 l3.4 3.4 l6 -6" stroke="#7ee787" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="740" y="293" font-size="15" fill="#c6d4e8">GFM 表格 / 任务列表 / 删除线 / 脚注</text>
  <rect x="712" y="306" width="15" height="15" rx="3" fill="#33476a"/>
  <path d="M715 313.5 l3.4 3.4 l6 -6" stroke="#7ee787" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="740" y="319" font-size="15" fill="#c6d4e8">Mermaid 图表 · 按需加载</text>
  <rect x="712" y="332" width="15" height="15" rx="3" fill="#33476a"/>
  <path d="M715 339.5 l3.4 3.4 l6 -6" stroke="#7ee787" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="740" y="345" font-size="15" fill="#c6d4e8">4 套内置主题 · 自定义主题导入</text>

  <!-- 公式 -->
  <rect x="712" y="362" width="500" height="34" rx="6" fill="#14233a"/>
