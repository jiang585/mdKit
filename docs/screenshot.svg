  <text x="814" y="458" font-size="14" fill="#7ee787">new</text>
  <text x="844" y="458" font-size="14" fill="#79c0ff">MdKit</text>
  <text x="880" y="458" font-size="14" fill="#c6d4e8">();</text>
  <text x="728" y="482" font-size="14" fill="#79c0ff">app</text>
  <text x="752" y="482" font-size="14" fill="#ff7b72">.</text>
  <text x="758" y="482" font-size="14" fill="#7ee787">render</text>
  <text x="790" y="482" font-size="14" fill="#c6d4e8">();</text>

  <!-- 状态栏 -->
  <rect x="30" y="658" width="1220" height="26" fill="#0b1420"/>
  <line x1="30" y1="658" x2="1250" y2="658" stroke="#1a2c47" stroke-width="1"/>
  <text x="56" y="676" font-size="13" fill="#7b8fb0">行 13:6</text>
  <text x="150" y="676" font-size="13" fill="#7b8fb0">字数 342</text>
  <text x="244" y="676" font-size="13" fill="#7b8fb0">UTF-8 · LF</text>
  <text x="620" y="676" font-size="13" fill="#7b8fb0">主题：海蓝深色</text>
  <text x="1060" y="676" font-size="13" fill="#7ee787">● 自动保存已开启</text>
